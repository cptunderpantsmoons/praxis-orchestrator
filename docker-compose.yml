services:
  neo4j:
    image: neo4j:5.20
    container_name: praxis-neo4j
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    environment:
      - NEO4J_AUTH=neo4j/praxis_neo4j_pwd_2026
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    networks:
      - praxis_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: praxis-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=praxis_qdrant_key_2026
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - praxis_net

  postgres:
    image: postgres:16-alpine
    container_name: praxis-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=praxis
      - POSTGRES_PASSWORD=praxis_pg_pwd
      - POSTGRES_DB=praxis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - praxis_net

  app:
    image: praxis:0.1.0
    container_name: praxis-app
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    env_file:
      - .env
    # Only inject host/port routing here — secrets come from .env via env_file.
    # A previous version hardcoded POSTGRES_DSN here with a stale 3-char password,
    # which overrode the correct env_file value and broke Postgres auth. Keep
    # DSNs out of this section.
    environment:
      - NEO4J_URI=bolt://127.0.0.1:7687
      - QDRANT_URL=http://127.0.0.1:6333
      - PUBLIC_URL=https://praxis.2.25.195.193.sslip.io
    depends_on:
      neo4j:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - "traefik.http.routers.praxis-app.rule=Host(`praxis.2.25.195.193.sslip.io`) || Host(`praxis.srv1603169.hstgr.cloud`)"
      - traefik.http.routers.praxis-app.entrypoints=websecure
      - traefik.http.routers.praxis-app.tls=true
      - traefik.http.routers.praxis-app.tls.certresolver=letsencrypt
      - traefik.http.services.praxis-app.loadbalancer.server.port=8000

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  postgres_data:

networks:
  praxis_net:
    driver: bridge
