<!-- src/praxis/features/templates/email_reply.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRAXIS Reply</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      padding: 32px;
      border-radius: 16px 16px 0 0;
      color: white;
    }
    .brand-badge {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.02em;
    }
    .brand-subtitle {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 4px;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 4px 24px rgba(99, 102, 241, 0.08);
    }
    .greeting {
      font-weight: 600;
      margin-bottom: 16px;
      color: #0f172a;
      font-size: 15px;
    }
    .body {
      font-size: 15px;
      line-height: 1.65;
      color: #1e293b;
    }
    .signature {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      color: #64748b;
      font-size: 14px;
    }
    .tone {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
      text-transform: capitalize;
    }
    .footer {
      text-align: center;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand-badge">◆ PRAXIS</div>
      <div class="brand-subtitle">Enterprise Email Assistant</div>
    </div>
    <div class="card">
      <div class="greeting">{{ greeting }}</div>
      <div class="body">{{ body_html|safe }}</div>
      <div class="signature">{{ signature }}</div>
      <div class="tone">tone: {{ tone }}</div>
    </div>
    <div class="footer">◆ Powered by PRAXIS</div>
  </div>
</body>
</html>
