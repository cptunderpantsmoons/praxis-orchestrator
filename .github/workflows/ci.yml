name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint ────────────────────────────────────────────────────────
  lint:
    name: Ruff Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  # ── Type Check ──────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: mypy (advisory)
        run: |
          uv pip install mypy 2>/dev/null || true
          uv run mypy src/praxis --ignore-missing-imports --no-error-summary 2>&1 | tail -20
        continue-on-error: true

  # ── Test (matrix) ──────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      neo4j:
        image: neo4j:5.20
        ports: ["7687:7687"]
        env:
          NEO4J_AUTH: "neo4j/testpassword"
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: praxis_test
        options: >-
          --health-cmd "pg_isready -U praxis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          POSTGRES_DSN: postgresql://praxis:testpassword@localhost:5432/praxis_test
          ENVIRONMENT: ci
        run: |
          uv run pytest \
            --cov=src/praxis \
            --cov-report=xml \
            --cov-report=html:screenshots/coverage_html \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            --tb=short \
            -q

      - name: Check coverage threshold
        run: |
          uv run coverage report --fail-under=85

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-${{ matrix.python-version }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
            screenshots/coverage_html/
          retention-days: 14

  # ── Security ────────────────────────────────────────────────────
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Bandit security scan
        run: |
          mkdir -p screenshots
          uv run bandit -r src/praxis -f json -o screenshots/bandit_report.json || true
          # Fail the build if HIGH or MEDIUM severity findings
          python3 -c "
          import json, sys
          d = json.load(open('screenshots/bandit_report.json'))
          totals = d.get('metrics', {}).get('_totals', {})
          high = totals.get('SEVERITY_HIGH', 0)
          med  = totals.get('SEVERITY_MEDIUM', 0)
          if high > 0 or med > 0:
              print(f'FAIL: Bandit found HIGH={high} MEDIUM={med} findings')
              sys.exit(1)
          print(f'PASS: HIGH={high} MEDIUM={med} LOW={totals.get(\"SEVERITY_LOW\", 0)}')
          "

      - name: pip-audit (project deps)
        run: |
          uv pip install pip-audit
          # Extract deps from pyproject.toml
          python3 -c "
          import tomllib
          with open('pyproject.toml','rb') as f: d=tomllib.load(f)
          for grp in ['dependencies']+list(d.get('dependency-groups',{}).keys()):
              items = d.get(grp,[]) if grp=='dependencies' else d['dependency-groups'][grp]
              for pkg in items: print(pkg)
          " > /tmp/requirements.txt
          cat /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --disable-pip

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: screenshots/bandit_report.json
          retention-days: 30

  # ── Docker build ────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: praxis:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test the image
        run: |
          docker run --rm -d --name praxis-smoke -p 8000:8000 praxis:${{ github.sha }}
          sleep 8
          curl -sf http://localhost:8000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json || (echo "Health check failed"; exit 1)
          docker stop praxis-smoke

  # ── Required status check aggregator ───────────────────────────
  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All required checks passed ✅"
