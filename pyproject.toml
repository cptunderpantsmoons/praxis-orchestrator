[project]
name = "praxis-v2"
version = "0.1.0"
description = "PRAXIS v2.0: Native asynchronous enterprise email agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",
    "langchain-core>=0.1.0",
    "structlog>=24.1.0",
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "coverage>=7.14.0",
    "bandit>=1.9.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
ai = [
    "langgraph>=0.0.50",
    "langchain-openai>=0.1.0",
]
infra = [
    "neo4j>=5.20.0",
    "qdrant-client>=1.8.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
]
email = [
    "agentmail>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]
